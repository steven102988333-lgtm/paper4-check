<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抄紙4号機 1分目視・欠点チェック表</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1677ff">
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js">
function saveAsFile(){const data={productName:productName.value,workDate:workDate.value,leader:leader.value,night:night.value,late:late.value,early:early.value,rows:[]};document.querySelectorAll("#tableBody tr").forEach(row=>{const r=[];row.querySelectorAll("input,textarea").forEach(el=>r.push(el.type==="checkbox"?el.checked:el.value));data.rows.push(r);});const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const pn=productName.value||"未輸入製品名";const wd=((workDate.value)||new Date().toISOString().split("T")[0]).replace(/-/g,"");const a=document.createElement("a");const url=URL.createObjectURL(blob);a.href=url;a.download=`抄紙4号機_${pn}_${wd}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},100);}

async function saveAsFile(){

    const data = {
        productName: productName.value,
        workDate: workDate.value,
        leader: leader.value,
        night: night.value,
        late: late.value,
        early: early.value,
        rows:[]
    };

    document.querySelectorAll("#tableBody tr")
    .forEach(row=>{

        const rowData=[];

        row.querySelectorAll("input,textarea")
        .forEach(el=>{

            rowData.push(
                el.type==="checkbox"
                ? el.checked
                : el.value
            );

        });

        data.rows.push(rowData);

    });

    const product =
        productName.value ||
        "未輸入製品名";

    const date =
        (
            workDate.value ||
            new Date().toISOString().split("T")[0]
        ).replaceAll("-","");

    const fileName =
        `抄紙4号機_${product}_${date}.json`;

    if(window.showSaveFilePicker){

        try{

            const handle =
            await window.showSaveFilePicker({

                suggestedName:fileName,

                types:[{
                    description:"JSON",

                    accept:{
                        "application/json":
                        [".json"]
                    }
                }]
            });

            const writable =
            await handle.createWritable();

            await writable.write(
                JSON.stringify(data,null,2)
            );

            await writable.close();

            return;

        }
        catch(e){

            if(e.name==="AbortError"){
                return;
            }

        }

    }

    const blob =
    new Blob(
        [JSON.stringify(data,null,2)],
        {type:"application/json"}
    );

    const url =
    URL.createObjectURL(blob);

    const a =
    document.createElement("a");

    a.href = url;
    a.download = fileName;

    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);

    URL.revokeObjectURL(url);

}

</script>
<style>
*{font-family:"Meiryo UI","Meiryo",sans-serif} body{margin:10px}h2{text-align:center}.top-info{display:flex;gap:20px;margin-bottom:10px}.top-info input{padding:5px}.sign-table{width:700px;border-collapse:collapse;margin-bottom:15px}.sign-table th,.sign-table td{border:1px solid #000;text-align:center}.sign-table td{height:140px}.stamp-box{width:100%;height:140px;border:none;resize:none;text-align:center;font-size:36px;font-weight:bold;box-sizing:border-box;padding-top:35px}.main-table{width:100%;border-collapse:collapse;font-size:12px}.main-table th,.main-table td{border:1px solid #000;text-align:center;padding:3px}.main-table input[type=text],.main-table input[type=number]{width:100%;border:none;box-sizing:border-box}.main-table textarea{width:100%;border:none;box-sizing:border-box}.btn-area{margin-bottom:10px}button{padding:8px 15px;cursor:pointer}.add-btn{background:#1677ff;color:#fff;border:none}.export-btn{background:#52c41a;color:#fff;border:none}.delete-btn{background:#ff4d4f;color:#fff;border:none}.save-btn{background:#fa8c16;color:#fff;border:none}.clear-btn{background:#cf1322;color:#fff;border:none}.print-btn{background:#722ed1;color:#fff;border:none}@media print{.btn-area,.delete-btn{display:none}@page{size:A4 landscape;margin:5mm}}

<body>
<h2>抄紙4号機 1分目視・欠点チェック表</h2>
<div class="top-info">
<label>製品名：<input type="text" id="productName"></label>
<label>日付：<input type="date" id="workDate"></label>
</div>
<table class="sign-table"><tr><th>職長</th><th>夜番</th><th>遅番</th><th>早番</th></tr><tr><td><textarea id="leader" class="stamp-box"></textarea></td><td><textarea id="night" class="stamp-box"></textarea></td><td><textarea id="late" class="stamp-box"></textarea></td><td><textarea id="early" class="stamp-box"></textarea></td></tr></table>
<div class="btn-area"><button class="add-btn" onclick="addRow()">Lot追加</button><button class="save-btn" onclick="saveAsFile()">另存新檔</button><button class="clear-btn" onclick="clearData()">清除資料</button><input type="file" id="fileInput" accept=".json" style="display:none" onchange="importFile(event)"><button class="export-btn" onclick="exportExcel()">Excel匯出</button><button class="print-btn" onclick="window.print()">列印</button></div>
<table class="main-table" id="checkTable"><thead><tr><th rowspan="3">ロットNo</th><th colspan="5">N</th><th colspan="5">S</th><th colspan="3">イメージセンサ<br>検出チェック</th><th colspan="3">イメージセンサ<br>設定チェック</th><th rowspan="3">備考</th><th rowspan="3">操作</th></tr><tr><th colspan="3">目視検査</th><th colspan="2">イメージセンサ</th><th colspan="3">目視検査</th><th colspan="2">イメージセンサ</th><th rowspan="2">穴</th><th rowspan="2">フクレ</th><th rowspan="2">羽根</th><th rowspan="2">波形状態</th><th rowspan="2">走査周波数(kHz)</th><th rowspan="2">調光設定</th></tr><tr><th>異物</th><th>スジ</th><th>押跡</th><th>数</th><th>内容</th><th>異物</th><th>スジ</th><th>押跡</th><th>数</th><th>内容</th></tr></thead><tbody id="tableBody"></tbody></table>
<script>
function addRow(){const tbody=document.getElementById('tableBody');const row=tbody.insertRow();row.innerHTML=`<td><input type="text" placeholder="Lot No"></td><td><input type="checkbox"></td><td><input type="checkbox"></td><td><input type="checkbox"></td><td><input type="number" min="0"></td><td><input type="text"></td><td><input type="checkbox"></td><td><input type="checkbox"></td><td><input type="checkbox"></td><td><input type="number" min="0"></td><td><input type="text"></td><td><input type="checkbox"></td><td><input type="checkbox"></td><td><input type="checkbox"></td><td><input type="text"></td><td><input type="text"></td><td><input type="text"></td><td><textarea rows="1"></textarea></td><td><button type="button" class="delete-btn" onclick="deleteRow(this)">刪除</button></td>`;}
function deleteRow(btn){if(confirm('確定刪除這筆資料嗎？')) btn.closest('tr').remove();}
function saveAsFile(){const data={productName:productName.value,workDate:workDate.value,leader:leader.value,night:night.value,late:late.value,early:early.value,rows:[]};document.querySelectorAll("#tableBody tr").forEach(row=>{const r=[];row.querySelectorAll("input,textarea").forEach(el=>r.push(el.type==="checkbox"?el.checked:el.value));data.rows.push(r);});localStorage.setItem("checkSheetData",JSON.stringify(data));const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);const productName=document.getElementById('productName').value||'未輸入製品名';const workDate=((document.getElementById('workDate').value)||new Date().toISOString().split('T')[0]).replaceAll('-','');a.download=`抄紙4号機_${productName}_${workDate}.json`;a.click();}
function loadData(){const s=localStorage.getItem("checkSheetData");if(!s)return;const o=JSON.parse(s);productName.value=o.productName||"";workDate.value=o.workDate||"";leader.value=o.leader||"";night.value=o.night||"";late.value=o.late||"";early.value=o.early||"";tableBody.innerHTML="";o.rows.forEach(rd=>{addRow();const c=document.querySelector("#tableBody tr:last-child").querySelectorAll("input,textarea");c.forEach((el,i)=>{if(el.type==="checkbox")el.checked=rd[i];else el.value=rd[i];});});}

function clearData(){if(!confirm("確定要清除所有資料嗎？此動作無法復原。")){return;}localStorage.removeItem("checkSheetData");document.getElementById("tableBody").innerHTML="";for(let i=0;i<30;i++) addRow();productName.value="";workDate.value="";leader.value="";night.value="";late.value="";early.value="";alert("資料已清除");}
function importFile(event){const file=event.target.files[0];if(!file)return;const r=new FileReader();r.onload=function(e){const o=JSON.parse(e.target.result);productName.value=o.productName||"";workDate.value=o.workDate||"";leader.value=o.leader||"";night.value=o.night||"";late.value=o.late||"";early.value=o.early||"";tableBody.innerHTML="";o.rows.forEach(rd=>{addRow();const c=document.querySelector("#tableBody tr:last-child").querySelectorAll("input,textarea");c.forEach((el,i)=>{if(el.type==="checkbox")el.checked=rd[i];else el.value=rd[i];});});};r.readAsText(file);}
function exportExcel(){const wb=XLSX.utils.book_new();const data=[];data.push(['抄紙4号機 1分目視・欠点チェック表']);data.push([]);data.push(['製品名',document.getElementById('productName').value]);data.push(['日付',document.getElementById('workDate').value]);data.push([]);data.push(['職長','夜番','遅番','早番']);data.push([leader.value,night.value,late.value,early.value]);data.push([]);data.push(['LotNo','N異物','Nスジ','N押跡','N数','N内容','S異物','Sスジ','S押跡','S数','S内容','穴','フクレ','羽根','波形状態','走査周波数(kHz)','調光設定','備考']);document.querySelectorAll('#tableBody tr').forEach(row=>{const r=[];row.querySelectorAll('input,textarea').forEach(el=>{r.push(el.type==='checkbox'?(el.checked?'✔':''):el.value)});r.pop();data.push(r)});const ws=XLSX.utils.aoa_to_sheet(data);ws['!cols']=[{wch:15},{wch:8},{wch:8},{wch:8},{wch:8},{wch:20},{wch:8},{wch:8},{wch:8},{wch:8},{wch:20},{wch:8},{wch:8},{wch:8},{wch:15},{wch:15},{wch:15},{wch:30}];XLSX.utils.book_append_sheet(wb,ws,'欠点チェック表');const pn=document.getElementById('productName').value||'未輸入製品名';const wd=(document.getElementById('workDate').value||'未輸入日期').replaceAll('-','');XLSX.writeFile(wb,`抄紙4号機_${pn}_${wd}.xlsx`);}
loadData(); if(document.querySelectorAll('#tableBody tr').length===0){for(let i=0;i<30;i++) addRow();} if(document.getElementById('workDate').value===''){document.getElementById('workDate').value=new Date().toISOString().split('T')[0];}

function saveAsFile(){const data={productName:productName.value,workDate:workDate.value,leader:leader.value,night:night.value,late:late.value,early:early.value,rows:[]};document.querySelectorAll("#tableBody tr").forEach(row=>{const r=[];row.querySelectorAll("input,textarea").forEach(el=>r.push(el.type==="checkbox"?el.checked:el.value));data.rows.push(r);});const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const pn=productName.value||"未輸入製品名";const wd=((workDate.value)||new Date().toISOString().split("T")[0]).replace(/-/g,"");const a=document.createElement("a");const url=URL.createObjectURL(blob);a.href=url;a.download=`抄紙4号機_${pn}_${wd}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},100);}

async function saveAsFile(){
const data={productName:productName.value,workDate:workDate.value,leader:leader.value,night:night.value,late:late.value,early:early.value,rows:[]};
document.querySelectorAll("#tableBody tr").forEach(row=>{const r=[];row.querySelectorAll("input,textarea").forEach(el=>r.push(el.type==="checkbox"?el.checked:el.value));data.rows.push(r);});

</script>
</body></html>
